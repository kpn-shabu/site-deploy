; {{SITE}} — PHP 生產設定(燒進 image 的 conf.d/site.ini)
; 本機開發由 compose.override.yml 掛 php.dev.ini 進 conf.d 後載覆蓋
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
expose_php = Off

; OPcache:生產不驗證 timestamp;換版後必須執行 reload-php 清空
; (realpath cache 亦靠 reload 清除,不受 OPcache 設定控制)
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
