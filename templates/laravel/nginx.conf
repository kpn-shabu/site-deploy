# {{SITE}} — nginx 主設定(與 php-fpm 同容器)
user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    # 與 php.ini 的 upload_max_filesize / post_max_size 對齊
    client_max_body_size 64m;

    server {
        listen 80;
        server_name _;

        # docroot 指向 current symlink;實際請求路徑由 $realpath_root 每請求解析,
        # 切換 release 才會即時生效(見 SOP「技術陷阱」)
        root /srv/{{SITE}}/current/src/public;
        index index.php;

        # healthcheck 端點(compose healthcheck 使用)
        location = /healthz {
            access_log off;
            return 200;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            # 關鍵:以 $realpath_root(每請求解析 symlink)取代 $document_root,
            # 結構性消除換版時新舊 release 混跑的窗口
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
        }

        # 隱藏檔一律拒絕(.well-known 除外)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
