# {{SITE}} — compose 基底(本機與遠端共用)
# 注意:此檔不使用變數插值(遠端 release 目錄沒有 .env 可供插值);
# env 一律由 override / prod 以 env_file 提供。
# name 寫死:任何目錄下跑 compose 都對到同一組 volume / 網路,
# 否則每次部署會生出新 volume(資料庫像消失一樣)。
name: "{{SITE}}"

services:
  app:
    build:
      context: ./docker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    # 版本 pin 到 major;major 升級屬另案(dump/restore),不可直接換 tag
    image: postgres:16-alpine
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      # $$ 為 compose 跳脫,實際於容器內展開 shell 變數(來自 env_file)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
