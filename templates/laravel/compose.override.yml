# {{SITE}} — 本機開發覆蓋(docker compose 自動載入;遠端不使用此檔)
# 本機直開 port、不跑 caddy、OPcache 改為每請求驗證。
services:
  app:
    ports:
      # 本機開發 port:scaffold 時先確認未被其他專案佔用(lsof -iTCP:<port> -sTCP:LISTEN),
      # 多專案並行請改成空閒 port,並同步更新 deploy/deploy.conf 的 APP_PORT_LOCAL
      - "8080:80"
    env_file:
      - ./.env
    volumes:
      # 專案根即 current → 容器內路徑與遠端完全一致
      - ".:/srv/{{SITE}}/current"
      # 本機上傳目錄(data/ 在 .gitignore)
      - "./data/uploads:/srv/{{SITE}}/shared/uploads"
      # 開發用 OPcache 覆蓋(validate_timestamps=1),後載蓋過 image 內 site.ini
      - "./docker/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini"

  postgres:
    # app 走 docker 網路連 DB,host 不需開 port。
    # 需要用本機 GUI 工具直連 DB 才取消註解;多專案並行時 5432 會互撞,請改用空閒 port。
    # ports:
    #   - "127.0.0.1:5432:5432"
    env_file:
      - ./.env
