# 本機開發 override:於專案根執行 docker compose 時自動載入;遠端不使用本檔。
services:
  app:
    # 開發指令(熱重載);本機不跑 caddy,port 直開
    command: npm run dev
    ports:
      # 本機開發 port:scaffold 時先確認未被其他專案佔用(lsof -iTCP:<port> -sTCP:LISTEN),
      # 多專案並行請改成空閒 port,並同步更新 deploy/deploy.conf 的 APP_PORT_LOCAL
      - "3000:3000"
    env_file:
      - ./.env
    volumes:
      # 專案根掛成 current → 容器內路徑本機與遠端完全一致
      - ".:/srv/{{SITE}}/current"
      # named volume 蓋住 node_modules,避免 host(如 mac arm64)與容器的二進位衝突
      - "node_modules:/srv/{{SITE}}/current/src/node_modules"
      # 上傳持久化目錄(data/ 已 gitignore),容器內路徑同遠端 shared/uploads
      - "./data/uploads:/srv/{{SITE}}/shared/uploads"

  postgres:
    # app 走 docker 網路連 DB,host 不需開 port。
    # 需要用本機 GUI 工具直連 DB 才取消註解(只綁 loopback);多專案並行時 5432 會互撞,請改用空閒 port。
    # ports:
    #   - "127.0.0.1:5432:5432"
    env_file:
      - ./.env

volumes:
  node_modules:
