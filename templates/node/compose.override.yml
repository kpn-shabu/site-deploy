# 本機開發 override:於專案根執行 docker compose 時自動載入;遠端不使用本檔。
services:
  app:
    # 開發指令(熱重載);本機不跑 caddy,port 直開
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    volumes:
      # 專案根掛成 current → 容器內路徑本機與遠端完全一致
      - ".:/srv/{{SITE}}/current"
      # named volume 蓋住 node_modules,避免 host(如 mac arm64)與容器的二進位衝突
      - "node_modules:/srv/{{SITE}}/current/src/node_modules"
      # 上傳持久化目錄(data/ 已 gitignore),容器內路徑同遠端 shared/uploads
      - "./data/uploads:/srv/{{SITE}}/shared/uploads"

  postgres:
    ports:
      # 只綁 loopback,供本機工具直連 DB
      - "127.0.0.1:5432:5432"
    env_file:
      - ./.env

volumes:
  node_modules:
