# nginx 設定(與 php-fpm 同容器;由 entrypoint 以 daemon off 前景執行)
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 20m;

    server {
        listen 80;
        server_name _;

        # docroot 指向 current symlink 下的 public;
        # 切換 release 只動 symlink,nginx 以 $realpath_root 每請求即時解析。
        root /srv/{{SITE}}/current/src/public;
        index index.php index.html;

        # healthcheck 端點(不進入應用程式)
        location = /healthz {
            access_log off;
            return 200;
        }

        # front controller:靜態檔優先,其餘一律交給 index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            # 一律用 $realpath_root(每請求解析 symlink 後的實體路徑),
            # 結構性消除 release 切換時的新舊混版窗口。
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
        }

        # 拒絕存取隱藏檔(.env、.git 等)
        location ~ /\. {
            deny all;
        }
    }
}
